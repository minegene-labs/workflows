name: swift-ci

on:
  workflow_call:
    inputs:
      scheme:
        type: string
        required: true
      core-path:
        type: string
        default: Core
      lint-paths:
        type: string
        default: .
      linux:
        type: boolean
        default: true
      xcodegen:
        type: boolean
        default: true
      macos-runner:
        type: string
        default: macos-26

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ inputs.linux && 'ubuntu-latest' || inputs.macos-runner }}
    container: ${{ inputs.linux && 'swift:6.2' || '' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CORE: ${{ inputs.core-path }}
      LINT: ${{ inputs.lint-paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ !inputs.linux && hashFiles('.xcode-version') != '' }}
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - run: |
          read -ra paths <<< "$LINT"
          swift format lint --strict --recursive "${paths[@]}"
      - run: swift test --package-path "$CORE"

  macos:
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('.xcode-version') != ''
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - if: inputs.xcodegen
        run: brew install xcodegen && xcodegen
      - run: xcodebuild build -scheme "$SCHEME" -destination platform=macOS
        env:
          SCHEME: ${{ inputs.scheme }}
