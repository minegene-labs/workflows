name: release

on:
  workflow_call:
    inputs:
      scheme:
        type: string
        required: true
      xcodegen:
        type: boolean
        default: true
      macos-runner:
        type: string
        default: macos-26
    secrets:
      app-id:
        required: true
      app-key:
        required: true

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-key }}
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SCHEME: ${{ inputs.scheme }}
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('.xcode-version') != ''
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - if: inputs.xcodegen
        run: brew install xcodegen && xcodegen
      - run: xcodebuild build -scheme "$SCHEME" -configuration Release -derivedDataPath build -destination platform=macOS MARKETING_VERSION="${TAG#v}"
      - run: |
          ditto -c -k --keepParent "build/Build/Products/Release/$SCHEME.app" "$SCHEME-$TAG.zip"
          shasum -a 256 "$SCHEME-$TAG.zip" > "$SCHEME-$TAG.zip.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.zip"
          create-storage-record: false
      - run: |
          gh release upload "$TAG" ./*.zip ./*.sha256 --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
